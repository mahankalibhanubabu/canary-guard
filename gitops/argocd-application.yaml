apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: canaryguard
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/mahankalibhanubabu/canary-guard.git
    targetRevision: main
    path: k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: canaryguard

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true